<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thẻ mới</title>
  <link rel="stylesheet" href="css/chrome.css" />
  <link rel="stylesheet" href="css/ask-ai.css" />
</head>
<body>
  <div class="chrome-window">
    <!-- Tab strip + Windows caption -->
    <header class="tabstrip">
      <div class="tabs" id="tabStrip"></div>
      <button class="tab-new" id="newTabBtn" title="Thẻ mới" aria-label="Thẻ mới">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/></svg>
      </button>
      <div class="tabstrip-spacer"></div>
      <div class="caption-buttons">
        <button class="caption-btn" title="Thu nhỏ" aria-label="Thu nhỏ">
          <svg viewBox="0 0 12 12" width="10" height="10"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button class="caption-btn" title="Phóng to" aria-label="Phóng to">
          <svg viewBox="0 0 12 12" width="10" height="10"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="caption-btn caption-close" title="Đóng" aria-label="Đóng">
          <svg viewBox="0 0 12 12" width="10" height="10"><path d="M2.2 2.2l7.6 7.6M9.8 2.2L2.2 9.8" stroke="currentColor" stroke-width="1.15" fill="none"/></svg>
        </button>
      </div>
    </header>

    <!-- Navigation toolbar -->
    <div class="toolbar">
      <div class="nav-btns">
        <button class="tool-btn" id="backBtn" title="Quay lại" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button class="tool-btn" id="fwdBtn" title="Tiến tới" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
        <button class="tool-btn" id="reloadBtn" title="Tải lại">
          <svg id="reloadIcon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>

      <div class="omnibox" id="omnibox">
        <button class="site-info" id="siteInfo" title="Thông tin trang" aria-label="Thông tin trang"></button>
        <input id="urlInput" type="text" spellcheck="false" autocomplete="off" placeholder="Tìm kiếm Google hoặc nhập URL" />
        <button class="omni-icon" title="Ghim trang này" aria-label="Ghim trang">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
      </div>

      <button class="ask-ai-btn" id="askAiBtn" title="Ask AI" aria-pressed="false">
        <svg class="sparkle" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#1A73E8" d="M12 2.2 13.7 8.3 19.8 10 13.7 11.7 12 17.8 10.3 11.7 4.2 10 10.3 8.3z"/>
          <path fill="#EA4335" d="M18.2 3.4 18.9 6.1 21.6 6.8 18.9 7.5 18.2 10.2 17.5 7.5 16.2 6.8 17.5 6.1z"/>
          <path fill="#FBBC05" d="M19.4 13.6 19.9 15.6 22 16.2 19.9 16.8 19.4 18.8 18.9 16.8 16.8 16.2 18.9 15.6z"/>
          <path fill="#34A853" d="M6.4 14.2 7.1 16.4 9.3 17.1 7.1 17.8 6.4 20 5.7 17.8 3.5 17.1 5.7 16.4z"/>
        </svg>
        <span>Ask AI</span>
      </button>

      <button class="tool-btn" title="Tiện ích">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5A1.5 1.5 0 0 0 11.5 2h-3A1.5 1.5 0 0 0 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.5 0 2.7 1.2 2.7 2.7s-1.2 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.5 1.2-2.7 2.7-2.7s2.7 1.2 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a1.5 1.5 0 0 0 0-3z"/></svg>
      </button>
      <button class="avatar-btn" title="Tài khoản Google" aria-label="Tài khoản">
        <span>T</span>
      </button>
      <button class="tool-btn" title="Tùy chỉnh và kiểm soát Google Chrome">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>

    <!-- Bookmark bar -->
    <nav class="bookmarks">
      <button class="bm" data-url="https://www.youtube.com" data-title="YouTube">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#FF0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .6 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8z"/><path fill="#fff" d="M9.8 15.6V8.4L15.6 12z"/></svg>
        YouTube
      </button>
      <button class="bm" data-url="https://mail.google.com" data-title="Gmail">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#EA4335" d="M1.5 6.5 12 13.5 22.5 6.5V5H1.5z"/><path fill="#FBBC05" d="M1.5 6.5v11h4v-8z"/><path fill="#34A853" d="M18.5 9.5v8h4v-11z"/><path fill="#4285F4" d="M5.5 17.5v-8L12 14.2l6.5-4.7v8z"/></svg>
        Gmail
      </button>
      <button class="bm" data-url="https://drive.google.com" data-title="Drive">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#4285F4" d="M8.5 3h7l7 12H15.5z"/><path fill="#EA4335" d="M8.5 3 1.5 15h7l7-12z"/><path fill="#FBBC05" d="M1.5 15 5 21h14l-3.5-6z"/><path fill="#34A853" d="M15.5 15H22.5L19 21H12z"/></svg>
        Drive
      </button>
      <button class="bm" data-url="https://maps.google.com" data-title="Maps">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#34A853" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg>
        Maps
      </button>
      <button class="bm" data-url="https://translate.google.com" data-title="Translate">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#4285F4" d="M12.9 15.1 11 10.3 9.1 15.1h3.8z"/><path fill="#4285F4" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-1.3-3.2H8.3L6.5 19h2.2l.7-1.8h5.2L16 19h2.3l-2.4-5.8L20 4zm-8.2 9.3L10.4 9h.8l1.4 4.3h-.8z"/></svg>
        Translate
      </button>
      <button class="bm" data-url="https://vi.wikipedia.org" data-title="Wikipedia">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#202124" d="M12.2 5.2c.5 0 .8.2 1.3.8l4.2 7.4c.2.3.3.4.6.4h.7v.7h-4.2v-.7h.6c.3 0 .4-.1.3-.4l-1-1.8H8.7l-1.2 2.2c-.1.2 0 .4.3.4h.8v.7H3.8v-.7h.6c.2 0 .4-.1.6-.4l4.6-8.2c.4-.7.8-.8 1.2-.8.3 0 .6.1.9.5l1.6 2.8 1.6-2.8c.3-.4.6-.5.9-.5zm-2 2.2L7.8 13h4.6L10.2 7.4z"/></svg>
        Wikipedia
      </button>
    </nav>

    <!-- Page + side panel -->
    <div class="main">
      <div class="webview">
        <div class="load-bar" id="loadBar"></div>
        <div class="page" id="page"></div>
        <div class="messenger-dock" id="messengerDock" aria-label="AI chats"></div>
      </div>

      <aside class="side-panel" id="sidePanel" hidden>
        <div class="panel-resizer" id="panelResizer"></div>

        <div class="panel-nav" id="sidePanelNav">
          <div class="panel-brand" id="panelBrand">
            <svg class="sparkle" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="#1A73E8" d="M12 2.2 13.7 8.3 19.8 10 13.7 11.7 12 17.8 10.3 11.7 4.2 10 10.3 8.3z"/>
              <path fill="#EA4335" d="M18.2 3.4 18.9 6.1 21.6 6.8 18.9 7.5 18.2 10.2 17.5 7.5 16.2 6.8 17.5 6.1z"/>
              <path fill="#FBBC05" d="M19.4 13.6 19.9 15.6 22 16.2 19.9 16.8 19.4 18.8 18.9 16.8 16.8 16.2 18.9 15.6z"/>
              <path fill="#34A853" d="M6.4 14.2 7.1 16.4 9.3 17.1 7.1 17.8 6.4 20 5.7 17.8 3.5 17.1 5.7 16.4z"/>
            </svg>
            Ask AI
          </div>
          <button class="tool-btn" id="closePanelBtn" title="Đóng">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
          </button>
        </div>

        <section class="panel-stage" id="homeView">
          <div class="ask-home-head">
            <div class="welcome-icon">
              <svg viewBox="0 0 24 24" width="28" height="28">
                <path fill="#1A73E8" d="M12 2.2 13.7 8.3 19.8 10 13.7 11.7 12 17.8 10.3 11.7 4.2 10 10.3 8.3z"/>
                <path fill="#EA4335" d="M18.2 3.4 18.9 6.1 21.6 6.8 18.9 7.5 18.2 10.2 17.5 7.5 16.2 6.8 17.5 6.1z"/>
                <path fill="#FBBC05" d="M19.4 13.6 19.9 15.6 22 16.2 19.9 16.8 19.4 18.8 18.9 16.8 16.8 16.2 18.9 15.6z"/>
                <path fill="#34A853" d="M6.4 14.2 7.1 16.4 9.3 17.1 7.1 17.8 6.4 20 5.7 17.8 3.5 17.1 5.7 16.4z"/>
              </svg>
            </div>
            <h2>Ask AI</h2>
            <p>What do you want to ask?</p>
          </div>
          <div class="open-chats" id="openChats" hidden></div>
          <div class="composer-block">
            <div class="suggest-row" id="homeSuggestions"></div>
          </div>
          <textarea id="askPrompt" rows="3" maxlength="2000" placeholder="Ask anything..."></textarea>
          <div class="composer-block">
            <div class="composer-label">Ask with</div>
            <div class="ask-with" id="homeProviderSelector"></div>
          </div>
          <button type="button" class="ask-cta" id="askCta" disabled>Ask →</button>
        </section>
      </aside>
    </div>
  </div>

  <script src="js/ask-ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
